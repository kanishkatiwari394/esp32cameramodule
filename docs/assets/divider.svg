<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#075985" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#075985"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="0.8" stop-color="#075985"/>
      <stop offset="1" stop-color="#075985" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: move 3.5s ease-in-out infinite; }
    @keyframes move { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="5" width="1200" height="4" rx="2" fill="url(#base)"/>
  <rect class="shine" x="0" y="3" width="260" height="8" rx="4" fill="url(#shine)"/>
</svg>
